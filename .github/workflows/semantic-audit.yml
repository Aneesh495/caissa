name: combined semantic witness audit
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: combined-semantic-witness-${{ github.ref }}
  cancel-in-progress: false
jobs:
  semantic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Original prospective G14 limits
        run: |
          python3 - <<'PY'
          import json,os,time
          rule=json.load(open('config/semantic-audit-development-v1.json'))
          assert int(os.environ['GITHUB_RUN_NUMBER'])<=rule['maximum_ci_executions']
          assert int(os.environ['GITHUB_RUN_ATTEMPT'])==1
          assert time.time()<rule['deadline_unix']<rule['parent_deadline_unix']
          PY
      - name: Fetch original compiled source identity
        timeout-minutes: 2
        run: git fetch --no-tags --depth=1 origin 5803cc485420b19eb96dda2c29f81fcfc6b09b6b
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent board and integer inference dependencies
        timeout-minutes: 3
        run: python -m pip install numpy==2.2.6 chess==1.11.2
      - name: Linux portability image for this new semantic component only
        if: runner.os == 'Linux'
        timeout-minutes: 3
        run: |
          cmake -S . -B build-g14 -DCMAKE_BUILD_TYPE=Release
          cmake --build build-g14 --target caissa -j 2
      - name: Actual witnesses and combined independent mutation audit
        timeout-minutes: 6
        shell: bash
        run: |
          if test "$RUNNER_OS" = 'macOS'; then
            python -m tests.semantic_audit --engine results/saved-v4-runtime-inputs/caissa --output runs/g14-semantic-witness
          else
            python -m tests.semantic_audit --engine build-g14/caissa --output runs/g14-semantic-witness
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semantic-witness-${{ matrix.os }}
          path: runs/g14-semantic-witness/
          retention-days: 14
