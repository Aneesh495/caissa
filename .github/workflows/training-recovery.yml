name: training recovery component
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: training-recovery-component-${{ github.ref }}
  cancel-in-progress: false
jobs:
  recovery:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Original prospective development bounds
        run: |
          python3 - <<'PY'
          import json,os,time
          rule=json.load(open('config/training-recovery-development-v1.json'))
          assert int(os.environ['GITHUB_RUN_NUMBER'])<=rule['maximum_ci_executions']
          assert int(os.environ['GITHUB_RUN_ATTEMPT'])==1
          assert time.time()<rule['deadline_unix']<rule['parent_deadline_unix']
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pinned independent dependencies
        timeout-minutes: 6
        shell: bash
        run: |
          python -m pip install numpy==2.2.6 chess==1.11.2
          if [[ "$RUNNER_OS" == Linux ]]; then
            python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          else
            python -m pip install torch==2.8.0
          fi
      - name: Original native classical contract
        timeout-minutes: 3
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 2
      - name: Actual interrupted trainer and independent state reconstruction
        timeout-minutes: 8
        run: python -m tests.training_recovery_component --engine build/caissa --output runs/g11-training-component
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: training-recovery-${{ matrix.os }}
          path: runs/g11-training-component/
          retention-days: 14
