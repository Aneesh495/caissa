name: amended original native browser capture
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Frozen amended source commit
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: amended-browser-capture-${{ github.ref }}
  cancel-in-progress: false
jobs:
  capture:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prospectively bounded amendment and source admission
        env:
          EXPECTED_SOURCE: ${{ inputs.source_sha }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,time
          from pathlib import Path
          rule=json.loads(Path('config/browser-capture-amendment-v1.json').read_text())
          assert os.environ['GITHUB_SHA']==os.environ['EXPECTED_SOURCE']
          assert int(os.environ['GITHUB_RUN_NUMBER'])<=rule['maximum_ci_executions']
          assert int(os.environ['GITHUB_RUN_ATTEMPT'])==1
          assert time.time()<rule['deadline_unix']<rule['parent_deadline_unix']
          for name,digest in rule['source_files'].items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==digest,name
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Pinned independent and actual browser dependencies
        timeout-minutes: 4
        run: |
          python -m pip install numpy==2.2.6 chess==1.11.2
          npm ci --ignore-scripts
          npm run build
          npx playwright install --with-deps chromium
      - name: Linux portability native image
        if: runner.os == 'Linux'
        timeout-minutes: 3
        run: |
          cmake -S . -B build-browser-capture -DCMAKE_BUILD_TYPE=Release
          cmake --build build-browser-capture --target caissa -j 2
      - name: Original failed capture inspection and corrected real browser verification
        timeout-minutes: 8
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if test "$RUNNER_OS" = 'macOS'; then
            python -m tests.browser_capture --engine results/saved-v4-runtime-inputs/caissa --output runs/g12-capture-amendment
          else
            python -m tests.browser_capture --engine build-browser-capture/caissa --output runs/g12-capture-amendment
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amended-browser-capture-${{ matrix.os }}
          path: |
            runs/g12-capture-amendment/
            !runs/g12-capture-amendment/original-failed-macos.zip
          retention-days: 14
