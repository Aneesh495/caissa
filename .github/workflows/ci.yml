name: correctness
on:
  push:
  pull_request:
concurrency:
  group: correctness-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the pinned compiled source for independent lineage
        timeout-minutes: 2
        run: git fetch --no-tags --depth=1 origin 5803cc485420b19eb96dda2c29f81fcfc6b09b6b
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Independent verifier dependencies
        run: python -m pip install numpy==2.2.6 chess==1.11.2
      - name: Build and original native correctness
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 4
          ctest --test-dir build --output-on-failure
          python tools/check_perft.py
          ./build/network_test models/diagnostic-v2.cai 10000
          ./build/network_test models/residual-prefix-diagnostic.cai 10000
          ./build/accumulator_stack_test models/residual-prefix-diagnostic.cai 10000
          ./build/accumulator_stack_test models/diagnostic-v2.cai 10000
          python tests/format_controls.py --network models/diagnostic-v2.cai
          python -m tests.statistics_test
          python -m tests.residual_contract
          python -m tests.arena_options
          python -m tests.features_test
          python -m tests.acquisition_limits
          python -m tests.recovery_scope
          python -m tests.campaign_cleanup
          python -m tests.power_guard
          python -m tests.full_strength
          python -m tests.heuristic_study
          python -m tests.full_actor_contract
          python -m tests.deferred_actor_contract
          python -m tests.strength_v4_profile --published-inputs --output runs/ci-strength-v4-profile
          python -m tests.full_model_protocol --output runs/ci-full-model-controls
          python -m tests.project_continuation
          python -m tests.source_binding --output runs/ci-source-binding
          python -m tests.full_bundle --output runs/ci-full-bundle
          python -m tests.numerical_bundle --output runs/ci-numerical-bundle
          python -m tests.bundle_integrity --output runs/ci-bundle-integrity
          python -m tests.bundle_copy --output runs/ci-bundle-copy
          python -m tests.learning_bundle --output runs/ci-learning-bundle
          python -m tests.performance_bundle --engine build/caissa --output runs/ci-performance-bundle
          python -m tests.acceptance_readiness --output runs/ci-acceptance-readiness
          python -m tests.rules_replay --engine build/caissa --output runs/ci-rules-replay
          python -m tests.protocol_bundle --engine build/caissa --output runs/ci-protocol-bundle
          python -m tests.restoration_replay --engine build/caissa --output runs/ci-restoration-replay
          python -m tests.draw_history --engine build/caissa --output runs/ci-draw-history
          python -m tests.search_semantics --engine build/caissa --output runs/ci-search-semantics
          python -m tests.deferred_neural_controls --evidence results/deferred-neural-2026-10-25 --output runs/ci-deferred-controls
          python -m training.corpus --engine build/caissa --pairs 50 --nodes 500 --workers 2 --output data/ci-original
          python -m training.prepare data/ci-original data/ci-prepared
          python -m verification.dataset data/ci-prepared data/ci-original
          python -m tests.data_profile --dataset data/ci-prepared --output runs/ci-data-profile
          python -m tests.dataset_controls --dataset data/ci-prepared --corpus data/ci-original --output runs/ci-data-controls
          python -m tests.independent_index_recovery --dataset data/ci-prepared --corpus data/ci-original --output runs/ci-independent-index-recovery --maximum-seconds 120
          python -m tests.data_catalog --dataset data/ci-prepared --corpus data/ci-original --output runs/ci-data-catalog
          python -m tests.g07_coordinator --catalog runs/ci-data-catalog/CATALOG.json --output runs/ci-g07-coordinator
          python -m tests.g07_inputs --corpus data/ci-original --dataset data/ci-prepared --output runs/ci-g07-inputs
      - name: Real analysis integration
        run: |
          npm ci --ignore-scripts
          npm run build
          node tests/service_workers.mjs
          node dist/analysis-service/server.js > runs/service.log 2>&1 &
          SERVICE_PID=$!
          trap 'kill "$SERVICE_PID"' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/api/session >/dev/null; then break; fi
            if test "$attempt" -eq 30; then echo 'Service readiness deadline exceeded'; exit 1; fi
            sleep 0.2
          done
          node tests/service_integration.mjs
          CAISSA_ENGINE=build/caissa node tests/search_inspection.mjs runs/ci-search-inspection
      - name: Native arena and semantic negative controls
        run: |
          python -m arena.run config/arena-ci.json runs/ci-arena --workers 1
          python -m arena.statistics runs/ci-arena
          python -m tests.match_journals --campaign runs/ci-arena --output runs/ci-match-journals
          python -m tests.strength_bundle --campaign runs/ci-arena --output runs/ci-strength-bundle
          python -m tests.systems_strength --campaign runs/ci-arena --output runs/ci-systems-strength
          python -m tests.arena_recovery_component --engine build/caissa --output runs/ci-arena-recovery-component
          python -m tests.strength_controls --campaign runs/ci-arena --output runs/ci-strength-controls
          python -m tools.evidence --checkout . --engine build/caissa --network models/diagnostic-v2.cai --arena runs/ci-arena --output runs/ci-evidence
          python -m verification.verify runs/ci-evidence --checkout . --expected-commit "$GITHUB_SHA" --profile diagnostic
          python -m tools.negative_controls runs/ci-evidence runs/ci-negative --checkout . --expected-commit "$GITHUB_SHA"
      - name: Docs and packaging
        run: |
          python tools/check_docs.py
          cmake --install build --prefix runs/package
          test -x runs/package/bin/caissa
          runs/package/bin/caissa --version
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostic-${{ matrix.os }}
          path: |
            runs/ci-evidence
            runs/ci-negative/CONTROLS.json
            runs/ci-arena/SUMMARY.json
            runs/ci-match-journals/*.json
            runs/ci-match-journals/*.log
            runs/ci-strength-bundle/*.json
            runs/ci-strength-bundle/*.log
            runs/ci-systems-strength/
            runs/ci-arena-recovery-component/
            runs/service.log
            runs/ci-source-binding/CONTROLS.json
            runs/ci-strength-v4-profile/CONTROLS.json
            runs/ci-strength-v4-profile/REAL_LINEAGE.json
            runs/ci-full-bundle/CONTROLS.json
            runs/ci-numerical-bundle/*.json
            runs/ci-numerical-bundle/*.log
            runs/ci-bundle-integrity/CONTROLS.json
            runs/ci-bundle-copy/*.json
            runs/ci-learning-bundle/*.json
            runs/ci-learning-bundle/*.log
            runs/ci-performance-bundle/
            runs/ci-g07-coordinator/
            runs/ci-g07-inputs/
            runs/ci-data-catalog/
            data/ci-original/
            data/ci-prepared/
            build/caissa
            runs/ci-acceptance-readiness/CONTROLS.json
            runs/ci-rules-replay/
            runs/ci-protocol-bundle/
            runs/ci-restoration-replay/CONTROLS.json
            runs/ci-restoration-replay/CAMPAIGN.json
            runs/ci-restoration-replay/*.json
            runs/ci-restoration-replay/*.log
            runs/ci-restoration-replay/producer/
            runs/ci-restoration-replay/independent/RESTORATION.json
            runs/ci-draw-history/*.json
            runs/ci-draw-history/*.jsonl
            runs/ci-draw-history/*.log
            runs/ci-draw-history/producer/
            runs/ci-draw-history/independent/DRAW_HISTORY.json
            runs/ci-draw-history/full-replay/G03/DRAW_HISTORY.json
            runs/ci-search-semantics/*.json
            runs/ci-search-semantics/*.jsonl
            runs/ci-search-semantics/*.log
            runs/ci-search-semantics/producer/
            runs/ci-search-semantics/independent/SEARCH_SEMANTICS.json
            runs/ci-search-semantics/independent/ORACLES.json
            runs/ci-search-semantics/independent/ABLATIONS.json
            runs/ci-search-semantics/full-replay/G05/SEARCH_SEMANTICS.json
            runs/ci-deferred-controls/CONTROLS.json
            build/Testing/Temporary/LastTest.log
          retention-days: 14
