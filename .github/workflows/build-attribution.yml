name: amended compiler inputs and two clean builds
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Frozen compiler attribution source
        required: true
permissions:
  contents: read
concurrency:
  group: bounded-compiler-attribution-${{ github.ref }}
  cancel-in-progress: false
jobs:
  attribution:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Source-bound later-authority amendment admission
        env:
          EXPECTED_SOURCE: ${{ inputs.source_sha }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,time
          from pathlib import Path
          rule=json.loads(Path('config/build-attribution-amendment-v1.json').read_text())
          assert os.environ['GITHUB_SHA']==os.environ['EXPECTED_SOURCE']
          assert int(os.environ['GITHUB_RUN_NUMBER'])<=rule['maximum_ci_executions']
          assert int(os.environ['GITHUB_RUN_ATTEMPT'])==1
          assert time.time()<rule['deadline_unix']<rule['parent_deadline_unix']
          for name,digest in rule['source_files'].items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==digest,name
          PY
      - name: Fetch original native source identity without rerunning its producers
        timeout-minutes: 2
        run: git fetch --no-tags --depth=1 origin 5803cc485420b19eb96dda2c29f81fcfc6b09b6b
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Actual new builds and independent compiler dependency replay
        timeout-minutes: 19
        run: python -m tests.build_reproduction --output runs/g15-build-attribution
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compiler-attribution-${{ matrix.os }}
          path: |
            runs/g15-build-attribution/*.json
            runs/g15-build-attribution/*.log
            runs/g15-build-attribution/public/
            runs/g15-build-attribution/positive/*.json
            runs/g15-build-attribution/positive/*.jsonl
            runs/g15-build-attribution/positive/*.log
            runs/g15-build-attribution/positive/build-*/trace/*.json
            runs/g15-build-attribution/positive/build-*/trace/*.deps
            runs/g15-build-attribution/positive/toolchain/COMPILER.json
          retention-days: 14
