name: wall-recovery-controls
on:
  push:
    paths:
      - 'tools/strength_wall_recovery.py'
      - 'tests/strength_wall_recovery.py'
      - '.github/workflows/wall-recovery.yml'
permissions:
  contents: read
  actions: read
jobs:
  retained-data-error:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Read preserved child failure without rerunning the campaign
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import io, os, urllib.request, zipfile
          for artifact in [12622195176,12620734758]:
              request=urllib.request.Request(f'https://api.github.com/repos/Aneesh495/caissa/actions/artifacts/{artifact}/zip',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request,timeout=25) as response:
                  data=response.read(16*1024*1024+1)
              assert len(data)<=16*1024*1024
              with zipfile.ZipFile(io.BytesIO(data)) as archive:
                  for name in archive.namelist():
                      if 'ci-data-catalog' in name and name.endswith(('.log','FAILED.json')):
                          info=archive.getinfo(name)
                          if info.file_size<=32768:
                              print('PRESERVED',artifact,name)
                              print(archive.read(name).decode('utf8',errors='replace'))
          PY
  controls:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.2.6 chess==1.11.2
      - name: Combined lease and committed-game recovery
        run: python -m tests.strength_wall_recovery
