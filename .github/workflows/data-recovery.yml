name: original data recovery component
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: original-data-recovery-${{ github.ref }}
  cancel-in-progress: false
jobs:
  recovery:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Original prospective development limits
        run: |
          python3 - <<'PY'
          import json,os,time
          rule=json.load(open('config/data-recovery-development-v1.json'))
          assert int(os.environ['GITHUB_RUN_NUMBER'])<=rule['maximum_ci_executions']
          assert int(os.environ['GITHUB_RUN_ATTEMPT'])==1
          assert time.time()<rule['deadline_unix']<rule['parent_deadline_unix']
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent replay dependencies
        timeout-minutes: 3
        run: python -m pip install numpy==2.2.6 chess==1.11.2
      - name: Actual SQL rollback and independent original-game/split reconstruction
        timeout-minutes: 6
        run: python -m tests.data_recovery_component --output runs/g11-data-component
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: data-recovery-${{ matrix.os }}
          path: runs/g11-data-component/
          retention-days: 14
