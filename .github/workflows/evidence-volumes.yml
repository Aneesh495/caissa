name: portable evidence volume codec
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portable-evidence-volumes-${{ github.ref }}
  cancel-in-progress: false
jobs:
  codec:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Original prospective codec development ceilings
        run: |
          python3 - <<'PY'
          import json,os,time
          rule=json.load(open('config/evidence-volume-development-v1.json'))
          assert int(os.environ['GITHUB_RUN_NUMBER'])<=rule['maximum_ci_executions']
          assert int(os.environ['GITHUB_RUN_ATTEMPT'])==1
          assert time.time()<rule['deadline_unix']<rule['parent_deadline_unix']
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Existing process-ownership reader dependencies
        timeout-minutes: 3
        run: python -m pip install numpy==2.2.6 chess==1.11.2
      - name: Streamed encoding, independent reconstruction and actual CLI forgeries
        timeout-minutes: 7
        run: python -m tests.evidence_volumes --output runs/evidence-volume-controls
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-volume-controls-${{ matrix.os }}
          path: runs/evidence-volume-controls/
          retention-days: 14
