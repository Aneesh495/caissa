name: power boundary waiting
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: power-boundary-${{ github.ref }}
  cancel-in-progress: false
jobs:
  boundary:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fixed new-domain development ceilings
        run: |
          python3 - <<'PY'
          import json,os,time
          rule=json.load(open('config/power-boundary-development-v1.json'))
          assert int(os.environ['GITHUB_RUN_NUMBER']) <= rule['maximum_ci_executions']
          assert int(os.environ['GITHUB_RUN_ATTEMPT']) == 1
          assert time.time() < rule['deadline_unix'] < rule['parent_deadline_unix']
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pinned board reader
        run: python -m pip install chess==1.11.2
      - name: Native diagnostic actor only
        shell: bash
        run: |
          if test "$RUNNER_OS" = Linux; then
            cmake -S . -B build-power -G Ninja -DCMAKE_BUILD_TYPE=Release
            cmake --build build-power --target caissa --parallel 2
            echo "POWER_ENGINE=$PWD/build-power/caissa" >> "$GITHUB_ENV"
          else
            python - <<'PY'
          import hashlib
          from pathlib import Path
          p=Path('results/saved-v4-runtime-inputs/caissa')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='1ff25a97b2272f589aac40049f9c76e53228a3682f64489c72566dae449a9897'
          p.chmod(0o755)
          PY
            echo "POWER_ENGINE=$PWD/results/saved-v4-runtime-inputs/caissa" >> "$GITHUB_ENV"
          fi
      - name: Boundary, clock, resume and real native diagnostics
        run: python -m tests.power_boundary --engine "$POWER_ENGINE" --output runs/power-boundary
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: power-boundary-${{ matrix.os }}
          path: runs/power-boundary/
          retention-days: 14
